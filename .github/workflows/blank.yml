name: Build VM Gamer Windows

on:
  workflow_dispatch:
    inputs:
      game_id:
        description: 'AppID do jogo na Steam (Ex: 730 para CS2)'
        required: false
        default: '730'

jobs:
  setup-windows-gamer:
    runs-on: windows-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Otimizar Espaço em Disco e Paginação
        run: |
          Write-Output "Configurando Arquivo de Paginação (Pagefile) para Jogos..."
          $System = Get-WmiObject -Class Win32_ComputerSystem -EnableAllPrivileges
          $System.AutomaticManagedPagefile = $False
          $System.Put()
          $PageFile = Get-WmiObject -Class Win32_PageFileSetting
          if ($PageFile) {
            $PageFile.InitialSize = 8192
            $PageFile.MaximumSize = 16384
            $PageFile.Put()
          }

      - name: Instalar Runtimes Essenciais para Jogos (DirectX / Visual C++)
        run: |
          choco install directx -y --no-progress
          choco install vcredist-all -y --no-progress
          choco install dotnet-desktopruntime -y --no-progress

      - name: Baixar e Configurar SteamCMD
        run: |
          New-Item -Path "C:\SteamCMD" -ItemType Directory -Force
          Invoke-WebRequest -Uri "https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip" -OutFile "C:\SteamCMD\steamcmd.zip"
          Expand-Archive -Path "C:\SteamCMD\steamcmd.zip" -DestinationPath "C:\SteamCMD" -Force
          Remove-Item "C:\SteamCMD\steamcmd.zip"

      - name: Baixar e Validar Arquivos do Jogo
        run: |
          & "C:\SteamCMD\steamcmd.exe" +login anonymous +app_update ${{ github.event.inputs.game_id }} validate +quit

      - name: Exibir Especificações do Runner Windows
        run: |
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, LogicalProcessorCount
          Get-CimInstance Win32_PhysicalMemory | Measure-Object -Property Capacity -Sum | Select-Object @{N="TotalRAM_GB";E={$_.Sum / 1GB}}
          Get-PSDrive C | Select-Object Used, Free
